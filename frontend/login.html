<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DCSION3 | Log in</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: { sans: ['Manrope', 'sans-serif'], display: ['Sora', 'sans-serif'] },
					colors: { ink: '#17191d', accent: '#f37b32', paper: '#f5f6fa' },
					boxShadow: { soft: '0 20px 55px rgba(32, 36, 45, .1)' }
				}
			}
		};
	</script>
	<style>
		:root {
			--paper: #f5f6fa; --surface: #ffffff; --ink: #17191d; --muted: #7d8188; --line: #e6e7eb;
			--accent: #f37b32; --accent-soft: #fff0e6; --shadow: 0 20px 55px rgba(32, 36, 45, .1);
		}
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; color: var(--ink); font-family: "Manrope", sans-serif;
			background: linear-gradient(180deg, #fbe4d2 0 280px, var(--paper) 520px);
			display: flex; align-items: center; justify-content: center; padding: 32px 16px;
		}
		button, input { font: inherit; }
		button { cursor: pointer; }
		h1, h2, p { margin: 0; }
		.wrap { width: 100%; max-width: 400px; }
		.brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 26px; }
		.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; font-size: 17px; font-weight: 700; }
		.brand-name { font-family: "Sora", sans-serif; font-size: 16px; font-weight: 700; }
		.brand-name span { display: block; color: var(--accent); font-size: 11px; font-weight: 600; margin-top: 2px; text-align: center; }
		.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 34px 32px; position: relative; overflow: hidden; }
		.card::after { content: ""; position: absolute; width: 190px; height: 190px; right: -70px; top: -90px; border-radius: 50%; border: 1px solid rgba(243, 123, 50, .2); box-shadow: 0 0 0 20px rgba(243, 123, 50, .06), 0 0 0 40px rgba(243, 123, 50, .03); pointer-events: none; }
		h1 { font-family: "Sora", sans-serif; font-size: 25px; letter-spacing: -.03em; margin-bottom: 6px; }
		.subtext { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 26px; }
		.form-row { display: grid; gap: 7px; margin-bottom: 16px; }
		.form-row label { color: var(--muted); font-size: 11.5px; font-weight: 700; }
		.form-row input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; color: var(--ink); background: var(--paper); }
		.form-row input:focus { outline: none; border-color: var(--accent); background: white; }
		.row-between { display: flex; justify-content: space-between; align-items: center; margin: -6px 0 20px; }
		.remember { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
		.remember input { accent-color: var(--accent); }
		.link { color: var(--accent); font-size: 12px; font-weight: 700; text-decoration: none; background: none; border: 0; padding: 0; }
		.link:hover { text-decoration: underline; }
		.error-text { color: #c1503a; font-size: 11.5px; margin: -8px 0 14px; display: none; }
		.error-text.show { display: block; }
		.submit-btn { width: 100%; border: 0; background: var(--ink); color: white; padding: 13px; border-radius: 10px; font-size: 13.5px; font-weight: 700; }
		.submit-btn:hover { background: #000; }
		.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--muted); font-size: 11px; }
		.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
		.google-btn { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 11px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 9px; }
		.google-btn:hover { border-color: #c9cbd1; background: #fafafa; }
		.google-icon { width: 16px; height: 16px; flex: 0 0 auto; }
		.foot { text-align: center; font-size: 13px; color: var(--muted); margin-top: 24px; }
		.privacy-note { display: flex; gap: 8px; color: var(--muted); font-size: 10.5px; line-height: 1.5; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
		.privacy-note strong { display: block; color: var(--ink); font-size: 11.5px; margin-bottom: 2px; }
		@media (max-width: 420px) { .card { padding: 28px 22px; } }

		.theme-toggle-auth { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; font-size: 15px; box-shadow: 0 8px 20px rgba(32, 36, 45, .08); }
		.theme-toggle-auth:hover { border-color: var(--accent); color: var(--accent); }

		/* ===== Refined dark mode — warm charcoal + orange ===== */
		body.night {
			--paper: #15100c; --surface: #211a13; --ink: #f7ede0; --muted: #b9a891; --line: #3c2f21;
			--accent: #ff8f4d; --accent-soft: #3a2416; --shadow: 0 24px 60px rgba(0,0,0,.55);
			background:
				radial-gradient(circle at 50% -10%, rgba(255, 143, 77, .16), transparent 26rem),
				linear-gradient(180deg, #1a130d 0 280px, #100c09 520px) !important;
		}
		body.night .brand-mark { background: var(--accent); }
		body.night .brand-name span { color: var(--accent); }
		body.night .card { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
		body.night .card::after { border-color: rgba(255, 143, 77, .22); box-shadow: 0 0 0 20px rgba(255, 143, 77, .08), 0 0 0 40px rgba(255, 143, 77, .04); }
		body.night .subtext, body.night .hint, body.night .quote-hint { color: var(--muted); }
		body.night .form-row label { color: var(--muted); }
		body.night .form-row input { background: #2a2118; border-color: var(--line); color: var(--ink); }
		body.night .form-row input:focus { border-color: var(--accent); background: #2f2419; }
		body.night .remember { color: var(--muted); }
		body.night .link { color: var(--accent); }
		body.night .submit-btn { background: var(--accent) !important; color: #2b1608; }
		body.night .submit-btn:hover { background: #ff9e63 !important; }
		body.night .divider { color: var(--muted); }
		body.night .divider::before, body.night .divider::after { background: var(--line); }
		body.night .google-btn { background: #241c14; border-color: var(--line); color: var(--ink); }
		body.night .google-btn:hover { border-color: #4a3a28; background: #2a2118; }
		body.night .foot { color: var(--muted); }
		body.night .privacy-note { border-color: var(--line); }
		body.night .privacy-note strong { color: var(--ink); }
		body.night .terms { color: var(--muted); }
		body.night .strength span { background: var(--line); }
		body.night .error-text { color: #ff9276; }
		@media (max-width: 420px) { .theme-toggle-auth { top: 14px; right: 14px; } }

	</style>
</head>
	<body class="!bg-gradient-to-b !from-[#fbe4d2] !via-[#f5f6fa] !to-[#f5f6fa] font-sans antialiased">
	<button class="theme-toggle-auth" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
	<div class="wrap w-full max-w-[400px]">
		<div class="brand mb-7 flex items-center justify-center gap-2.5">
			<div class="brand-mark grid h-9 w-9 place-items-center rounded-full !bg-[#f37b32] text-white">+</div>
			<div class="brand-name font-display text-base font-bold">DCSION3<span>student wellbeing</span></div>
		</div>

		<div class="card !rounded-2xl !border-[#e6e7eb] !bg-white !p-8 !shadow-soft max-sm:!px-5">
			<h1>Welcome back.</h1>
			<p class="subtext">Log in to see your workload, tasks, and how the week is actually going.</p>

			<form id="loginForm" novalidate>
				<div class="form-row">
					<label for="email">Email</label>
					<input class="!rounded-lg !border-[#e6e7eb] !bg-[#f5f6fa] px-3 py-3 focus:!border-[#f37b32] focus:!bg-white focus:outline-none" id="email" type="email" required placeholder="you@university.edu">
				</div>
				<div class="form-row" style="margin-bottom: 8px;">
					<label for="password">Password</label>
					<input class="!rounded-lg !border-[#e6e7eb] !bg-[#f5f6fa] px-3 py-3 focus:!border-[#f37b32] focus:!bg-white focus:outline-none" id="password" type="password" required placeholder="Enter your password">
				</div>
				<p class="error-text" id="errorText">Enter both your email and password to continue.</p>
				<div class="row-between">
					<label class="remember"><input type="checkbox" id="remember"> Remember me</label>
					<button type="button" class="link" id="forgotBtn">Forgot password?</button>
				</div>
				<button type="submit" class="submit-btn !rounded-lg !bg-[#17191d] py-3 hover:!bg-black" id="submitBtn">Log in</button>
			</form>

			<div class="divider">or</div>
			<button class="google-btn !rounded-lg !border-[#e6e7eb] !bg-white py-3 hover:!bg-[#fafafa]" id="googleBtn">
				<svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
				Continue with Google
			</button>

			<p class="foot">New here? <a class="link" href="signup.html">Create an account</a></p>

			<div class="privacy-note"><span>◎</span><div><strong>Your space is private</strong>Your data stays on this device.</div></div>
		</div>
	</div>

	<script>
		document.getElementById('themeToggle').addEventListener('click', () => {
			document.body.classList.toggle('night');
			document.getElementById('themeToggle').textContent = document.body.classList.contains('night') ? '☀' : '◐';
		});

		const form = document.getElementById('loginForm');
		const errorText = document.getElementById('errorText');
		const submitBtn = document.getElementById('submitBtn');

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const email = document.getElementById('email').value.trim();
			const password = document.getElementById('password').value;
			if (!email || !password) {
				errorText.textContent = 'Enter both your email and password to continue.';
				errorText.classList.add('show');
				return;
			}
			errorText.classList.remove('show');
			submitBtn.textContent = 'Logging in…';
			submitBtn.disabled = true;
			// Placeholder: wire this up to the real auth endpoint.
			setTimeout(() => { window.location.href = 'Home_page.html'; }, 500);
		});

		document.getElementById('forgotBtn').addEventListener('click', () => {
			errorText.textContent = "Password reset isn't wired up yet in this prototype.";
			errorText.classList.add('show');
		});

		document.getElementById('googleBtn').addEventListener('click', () => {
			errorText.textContent = 'Google sign-in is not connected in this prototype yet.';
			errorText.classList.add('show');
		});
	</script>
</body>
</html>
